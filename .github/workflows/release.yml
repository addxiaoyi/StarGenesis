name: release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release version
        run: |
          python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          namespace = {'m': 'http://maven.apache.org/POM/4.0.0'}
          project = ET.parse('pom.xml').getroot()
          version = project.findtext('m:version', namespaces=namespace)
          tag = os.environ['GITHUB_REF_NAME']
          if not version or version.endswith('-SNAPSHOT') or tag != f'v{version}':
              sys.exit(f'Release tag {tag!r} must match a non-SNAPSHOT Maven version as v<version>.')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              environment.write(f'PROJECT_VERSION={version}\n')
          print(f'Verified release tag {tag}')
          PY
      - run: python scripts/check_boundaries.py
      - run: sh mvnw -B -ntp clean verify
      - name: Generate aggregate CycloneDX SBOM
        if: matrix.java == '21'
        run: sh mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DskipTests
      - name: Assemble release assets
        if: matrix.java == '21'
        run: |
          mkdir -p dist
          cp "stargenesis-paper/target/stargenesis-paper-${PROJECT_VERSION}.jar" dist/StarGenesis.jar
          cp "stargenesis-integrations/target/stargenesis-integrations-${PROJECT_VERSION}.jar" dist/StarGenesis-Integrations-SDK.jar
          cp target/bom.json target/bom.xml dist/
          (cd dist && sha256sum StarGenesis.jar StarGenesis-Integrations-SDK.jar bom.json bom.xml > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: matrix.java == '21'
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
