name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  java:
    strategy:
      matrix:
        java: ['21', '25']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check_boundaries.py
      - run: python -m unittest discover -s scripts -p "test_release_candidate_builder.py"
      - run: python -m unittest discover -s scripts -p "test_server_*lifecycle_smoke.py"
      - run: node --test scripts/test_offline_client_lifecycle_smoke.cjs scripts/test_offline_client_radio_lifecycle_smoke.cjs
      - run: sh mvnw -B -ntp verify
      - run: >-
          python scripts/test_settlement_process_lock.py
          --java-home "$JAVA_HOME"
          --plugin-jar stargenesis-paper/target/stargenesis-paper-4.0.0-SNAPSHOT.jar
          --output target/settlement-process-lock.json
      - run: >-
          python scripts/test_worker_directory_lock.py
          --java-home "$JAVA_HOME"
          --plugin-jar stargenesis-paper/target/stargenesis-paper-4.0.0-SNAPSHOT.jar
          --output target/worker-directory-lock.json
      - run: >-
          python scripts/test_release_artifact_signer.py
          --java "$(command -v java)"
          --plugin-jar stargenesis-paper/target/stargenesis-paper-4.0.0-SNAPSHOT.jar
          --sbom target/sbom.json
          --output target/release-signer-smoke.json
      - run: >-
          python scripts/test_signed_design_package_signer.py
          --java-home "$JAVA_HOME"
          --java "$(command -v java)"
          --plugin-jar stargenesis-paper/target/stargenesis-paper-4.0.0-SNAPSHOT.jar
          --design stargenesis-design/src/main/resources/examples/blueprint.json
          --output target/signed-design-signer-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stargenesis-java-${{ matrix.java }}
          path: |
            stargenesis-paper/target/stargenesis-paper-*.jar
            target/release-signer-smoke.json
            target/signed-design-signer-smoke.json
            target/settlement-process-lock.json
            target/worker-directory-lock.json
            target/sbom.json
            **/target/surefire-reports/*
